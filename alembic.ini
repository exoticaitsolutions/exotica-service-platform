# Alembic Configuration File

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# Uncomment the line below if you want the files to be prepended with date and time
;file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present
# defaults to the current directory
prepend_sys_path = .

# timezone to use when rendering the date
# within the migration file as well as the filename.
# string value is passed to datetime.tz module. If left blank
# the timezone falls back to `datetime.tzlocal()`, which
# will depend on the system configuration and available pytz
# representations. If python requires a tz, sqlalchemy.exc.ArgumentError
# exceptions can occur. Uncomment this line to specify an explicit timezone.
;sqlalchemy.url.timezone =

# max length of characters to apply to the
# "slug" field of the filename
# when doing an autogenerate
# defaults to
;truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to permit autogenerate revisions
# of empty migrations
# autogenerate_empty_migrations = false

# set to 'true' to enable the -x command line flag,
# which will instruct Alembic to prepend the current
# user's username before the revision message.
# See @@
# user_locale_opts = true

# When set to 'true', revision files
# are written as UTC. When False, they
# are written in local time.
# revision_file_mode = local

# set to string 'true' to post_write_hooks to -q or --quiet
# set to string 'false' to post_write_hooks to NOT use -q or --quiet (default)
# post_write_hooks_format_args_is_multiline = false

# post_write_hooks
# post_write_hooks define scripts or Python functions that get executed
# after generating a new revision file.  See the documentation for further
# detail and examples

# format using "black" - use the console_scripts runner, against the "black" entrypoint
# lint and format code after generating a new revision
;post_write_hooks = black
;post_write_hooks_black.type = console_scripts
;post_write_hooks_black.entrypoint = black
;post_write_hooks_black.options = --line-length 88 REVISION_SCRIPT_FILENAME

# lint using "ruff" - use the console_scripts runner, against the "ruff" entrypoint
;post_write_hooks = ruff
;post_write_hooks_ruff.type = console_scripts
;post_write_hooks_ruff.entrypoint = ruff
;post_write_hooks_ruff.options = --fix REVISION_SCRIPT_FILENAME

# Logging configuration
[loggers]
keys = root,sqlalchemy.engine

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy.engine]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
