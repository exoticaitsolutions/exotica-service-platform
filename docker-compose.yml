version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: exotica
      POSTGRES_PASSWORD: exotica_dev_password
      POSTGRES_DB: exotica_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exotica"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://exotica:exotica_dev_password@postgres:5432/exotica_dev
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: local
      LOG_LEVEL: DEBUG
      PROCESS_TYPE: web
      JWT_SECRET_ARN: JWT_SECRET
      SECRETS_PROVIDER: env
      JWT_SECRET: "dev-jwt-secret"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  redis_data:
