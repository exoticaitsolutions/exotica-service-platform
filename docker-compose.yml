version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: exotica
      POSTGRES_PASSWORD: exotica_dev_password
      POSTGRES_DB: exotica_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exotica"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://exotica:exotica_dev_password@postgres:5432/exotica_dev
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: staging
      LOG_LEVEL: INFO
      PROCESS_TYPE: web
      JWT_SECRET_ARN: JWT_SECRET
      JWT_SECRET: dev-jwt-secret-demo-platform-2026
      SECRETS_PROVIDER: env
      CORS_ALLOWED_ORIGINS: http://99.79.73.6:8000,http://99.79.73.6,http://localhost:3000,http://localhost:8000,http://localhost:3001
      # QuickBooks Integration — see .env.template for setup
      QUICKBOOKS_CLIENT_ID: ${QUICKBOOKS_CLIENT_ID:-}
      QUICKBOOKS_CLIENT_SECRET: ${QUICKBOOKS_CLIENT_SECRET:-}
      QUICKBOOKS_REALM_ID: ${QUICKBOOKS_REALM_ID:-}
      QUICKBOOKS_REFRESH_TOKEN: ${QUICKBOOKS_REFRESH_TOKEN:-}
      QUICKBOOKS_ENVIRONMENT: ${QUICKBOOKS_ENVIRONMENT:-sandbox}
      # ServiceTitan Integration
      SERVICETITAN_API_KEY: ${SERVICETITAN_API_KEY:-}
      SERVICETITAN_API_ENDPOINT: ${SERVICETITAN_API_ENDPOINT:-https://api.sandbox.servicetitan.com}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  redis_data:
